server:
  # 容器内固定监听 8080；宿主由 Compose 映射为 18090（架构 §1.3 / 03 契约 §0.1）。
  # Dockerfile 同步 EXPOSE 8080；业务服务投递目标为 http://ontology-service:8080/internal/events。
  port: 8080

spring:
  application:
    name: ontology-service
  # 主数据源：本体库（读写，唯一写者）。宿主端口 55433，容器内 5432。
  datasource:
    url: ${ONTOLOGY_DB_URL:jdbc:postgresql://ontology-db:5432/ontologydb}
    username: ${ONTOLOGY_DB_USER:onto}
    password: ${ONTOLOGY_DB_PASSWORD:onto123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jackson:
    # 演示系统按本地时间解释，不做 UTC 自动转换
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: always

# 只读数据源：原业务库。仅用于全量导入 / 对账 / 重建 / 健康探测 / Outbox 追赶。
# 独立 Hikari 池 + 连接级 setReadOnly(true) + 代码层只有 SELECT；
# 部署时应把 SOURCE_DB_USER 换成数据库只读账号（架构 §11-A，主理人已拍板）。
# 注意：底座绝不写业务库，也不因读数失败影响业务事务。
source-db:
  url: ${SOURCE_DB_URL:jdbc:postgresql://db:5432/schooldemo}
  username: ${SOURCE_DB_USER:demo}
  password: ${SOURCE_DB_PASSWORD:demo123456}
  driver-class-name: org.postgresql.Driver
  read-only: true
  hikari:
    maximum-pool-size: 4
    minimum-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

ontology:
  # 平台「返回原业务对象」按钮跳转的原业务前端地址（A5：只跳转，不在平台改数据）。
  business-web-base: ${BUSINESS_WEB_BASE:http://localhost:5180}
  # ── 关系类型在线编辑（07 增量设计 §2.2 / §4.1）─────────────────────────
  # overlay 目录：在线改动落在这里的 relation-types.yaml，属运行时数据、不进版本库。
  definition-dir: ${ONTOLOGY_DEFINITION_DIR:/app/ontology-data}
  # 是否允许「应用到运行时」通过受控自退出重启生效。
  # 默认 false：裸 `java -jar` 无 supervisor 时自杀会永久宕机；仅容器编排里显式设为 true。
  self-restart-enabled: ${ONTOLOGY_SELF_RESTART_ENABLED:false}
  # 生效方式：RESTART=自退出重启（容器编排）；MANUAL=只落盘并提示手动重启。
  apply-mode: ${ONTOLOGY_APPLY_MODE:RESTART}
  sync:
    # Outbox 兜底追赶周期（毫秒）。业务侧投递器为 1s，这里是「漏投」的二次保险。
    catchup-ms: ${ONTOLOGY_CATCHUP_MS:2000}
    # 来源健康探测周期（毫秒），驱动「来源不可用」标记与 demoTime 投影。
    health-ms: ${ONTOLOGY_HEALTH_MS:5000}
    # 单次追赶最多读取的事件数，避免长事务。
    catchup-batch: ${ONTOLOGY_CATCHUP_BATCH:200}
    # 全量导入分页大小。
    import-page-size: ${ONTOLOGY_IMPORT_PAGE_SIZE:500}
    # 关系图节点上限（Q5 默认 ≤50）。
    graph-node-limit: ${ONTOLOGY_GRAPH_LIMIT:50}

management:
  endpoints:
    web:
      exposure:
        include: health
