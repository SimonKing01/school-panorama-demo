server:
  port: 8080

spring:
  application:
    name: school-panorama-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/schooldemo}
    username: ${SPRING_DATASOURCE_USERNAME:demo}
    password: ${SPRING_DATASOURCE_PASSWORD:demo123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jackson:
    # 演示系统按本地时间解释，不做 UTC 自动转换
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health
